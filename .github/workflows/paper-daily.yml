name: Paper Daily

on:
  schedule:
    - cron: "0 1 * * *" # Beijing 09:00; GitHub may delay scheduled jobs.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "回看天数（首次建议 7）"
        default: "2"
        required: true
        type: choice
        options: ["2", "7", "14"]
      max_summaries:
        description: "摘要上限；首次连通验收选 1"
        default: "10"
        type: choice
        options: ["1", "10"]
      initialize_budget:
        description: "仅首次创建预算账本；已有账本不会重置"
        default: false
        type: boolean
      refresh_only:
        description: "仅重新发布已有日报，不抓取论文、不调用模型"
        default: false
        type: boolean
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: personal-paper-daily
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    if: github.event_name != 'issues' || (github.event.issue.title == 'Research Interests' && github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline verification
        env:
          BUDGET_PERSIST_GITHUB: "false"
          ENABLE_ISSUE_CONFIG: "false"
        run: python -m unittest discover -s tests -v
      - name: Restore durable state
        env:
          BUDGET_ALLOW_INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_budget && 'true' || 'false' }}
        run: python -m scripts.state_store hydrate
      - name: Collect and summarize
        if: ${{ !inputs.refresh_only }}
        env:
          ENABLE_ISSUE_CONFIG: "true"
          CONFIG_ISSUE_TITLE: Research Interests
          LLM_PROVIDER: deepseek
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-flash
          LLM_CONCURRENCY: "2"
          LLM_MONTHLY_BUDGET_CNY: "10"
          LLM_DAILY_ATTEMPT_LIMIT: "10"
          LLM_MAX_OUTPUT_TOKENS: "1800"
          LLM_MAX_PROMPT_BYTES: "16000"
          DEEPSEEK_INPUT_CNY_PER_MILLION: "2"
          DEEPSEEK_OUTPUT_CNY_PER_MILLION: "8"
          LLM_BUDGET_PATH: .paper-state/usage.json
          BUDGET_PERSIST_GITHUB: "true"
          BUDGET_ALLOW_INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_budget && 'true' || 'false' }}
          MAX_PER_TOPIC: "50"
          MAX_SUMMARIES: ${{ inputs.max_summaries || '10' }}
          MAX_NEW_PAPERS: "10"
          HISTORICAL_DAILY_TARGET: "4"
          HISTORICAL_YEARS: "5"
          MAX_STORED_PAPERS: "900"
          RECENT_HISTORY_DAYS: "60"
          MIN_DAILY_PAPERS: "0"
          ARXIV_QUERY_MODE: keyword
          ARXIV_DELAY_SECONDS: "15"
          ARXIV_RETRY_THROTTLED: "false"
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '2' }}
          INCREMENTAL_SINCE_LAST_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          INCREMENTAL_OVERLAP_HOURS: "24"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -c "import os; assert os.getenv('DEEPSEEK_API_KEY'), 'DEEPSEEK_API_KEY secret is missing'"
          python -m scripts.collect_papers
      - name: Save durable paper history
        if: ${{ !inputs.refresh_only }}
        run: python -m scripts.state_store snapshot
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report summary failures
        run: |
          python -c "import json; s=json.load(open('web/data/papers.json',encoding='utf-8'))['stats']; print('Fetch failures:',s.get('failed_fetches',0),'LLM failures:',s.get('llm_failure_count',0)); assert s.get('llm_failure_count',0)==0, 'Page published with summary failures; inspect status and budget'"
