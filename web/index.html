<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>boy的论文日报</title>
    <link rel="stylesheet" href="./styles.css?v=20261103-personal" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">PD</span>
        <div>
          <h1>boy的论文日报</h1>
          <p class="brand-subtitle">GUI Agent · VLM · Efficiency</p>
          <p id="updatedAt">正在读取数据</p>
        </div>
      </div>
      <nav class="top-actions" aria-label="页面操作">
        <div class="theme-switcher" role="radiogroup" aria-label="选择网站背景主题">
          <button class="theme-option" type="button" role="radio" aria-checked="true" data-theme-option="dark" title="深色主题">
            <span class="theme-swatch dark-swatch"></span>
            <span>深色</span>
          </button>
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-theme-option="light" title="淡色主题">
            <span class="theme-swatch light-swatch"></span>
            <span>淡色</span>
          </button>
          <button class="theme-option" type="button" role="radio" aria-checked="false" data-theme-option="eye" title="护眼主题">
            <span class="theme-swatch eye-swatch"></span>
            <span>护眼</span>
          </button>
        </div>
        <a class="icon-link" href="https://github.com/devil-liuboy/paper-daily/issues" target="_blank" rel="noreferrer" title="配置研究方向">⚙</a>
        <a class="icon-link" href="https://github.com/devil-liuboy/paper-daily/actions" target="_blank" rel="noreferrer" title="查看更新任务">↻</a>
      </nav>
    </header>

    <main class="shell">
      <section class="overview" aria-label="概览">
        <div class="overview-title">
          <p>Research Radar</p>
          <h2 id="viewTitle">最新论文</h2>
        </div>
        <div class="metric-grid">
          <div class="metric">
            <span class="metric-value" id="paperCount">0</span>
            <span class="metric-label">总论文</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="weekCount">0</span>
            <span class="metric-label">本周新增</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="monthCount">0</span>
            <span class="metric-label">本月新增</span>
          </div>
          <div class="metric accent">
            <span class="metric-value" id="topScore">0.00</span>
            <span class="metric-label">最高匹配</span>
          </div>
        </div>
      </section>

      <section class="toolbar" aria-label="筛选">
        <div class="collection-tabs" role="tablist" aria-label="论文集合">
          <button class="collection-tab active" type="button" data-collection="daily">每日新论文</button>
          <button class="collection-tab" type="button" data-collection="conference" hidden>顶会精品</button>
        </div>
        <div class="tabs" role="tablist" aria-label="视图">
          <button class="tab" type="button" data-view="all">全部</button>
          <button class="tab active" type="button" data-view="daily">当日</button>
          <button class="tab" type="button" data-view="week">本周</button>
          <button class="tab" type="button" data-view="month">本月</button>
          <button class="tab" type="button" data-view="highlights">本周精选</button>
        </div>
        <div class="filters">
          <label class="field compact">
            <span>日期</span>
            <select id="dateFilter"></select>
          </label>
          <label class="field">
            <span>方向</span>
            <select id="topicFilter"></select>
          </label>
          <label class="field">
            <span>匹配</span>
            <select id="levelFilter">
              <option value="all">全部</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label class="field search">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="标题、作者、关键词" />
          </label>
        </div>
      </section>

      <p class="reading-note">优先关注 GUI Agent、VLM 与效率研究，少量探索其他 AI 和地下退化导航。按 arXiv 最近更新时间检索，包含新发与修订论文。中文分析仅基于标题与摘要；实验数字为作者报告，未经独立复现。匹配度表示与研究方向的相关程度，不是论文质量等级。</p>
      <p id="runStatus" class="run-status" role="status" hidden></p>

      <section class="content">
        <div class="content-head">
          <div>
            <h2 id="listTitle">当日论文</h2>
            <p id="scopeLabel">-</p>
          </div>
          <span id="resultCount">0 篇</span>
        </div>
        <div id="paperList" class="paper-list"></div>
      </section>
    </main>

    <template id="paperTemplate">
      <article class="paper-card">
        <div class="paper-main">
          <div class="paper-meta">
            <span class="match-badge"></span>
            <span class="paper-date"></span>
            <span class="paper-source"></span>
            <span class="summary-status"></span>
          </div>
          <h3 class="paper-title"></h3>
          <p class="paper-authors"></p>
          <div class="paper-tags"></div>
          <dl class="summary-grid">
            <div>
              <dt>问题</dt>
              <dd class="summary-problem"></dd>
            </div>
            <div>
              <dt>方法</dt>
              <dd class="summary-method"></dd>
            </div>
            <div>
              <dt>创新</dt>
              <dd class="summary-innovation"></dd>
            </div>
            <div>
              <dt>证据</dt>
              <dd class="summary-evidence"></dd>
            </div>
            <div>
              <dt>局限</dt>
              <dd class="summary-limitations"></dd>
            </div>
            <div>
              <dt>匹配</dt>
              <dd class="summary-relevant"></dd>
            </div>
          </dl>
        </div>
        <footer class="paper-footer">
          <span class="match-reason"></span>
          <div class="paper-links">
            <a class="paper-link abs-link" target="_blank" rel="noreferrer">原文</a>
            <a class="paper-link pdf-link" target="_blank" rel="noreferrer">PDF</a>
            <a class="paper-link download-link">下载 PDF</a>
          </div>
        </footer>
      </article>
    </template>

    <script src="./app.js?v=20261103-personal"></script>
  </body>
</html>
